name: Arnes de fichas (crear -> auditar -> corregir)

# Automatiza el ciclo completo de una ficha nueva fuera de una sesión interactiva:
# crear, auditar y corregir hasta que la auditoría apruebe o se agoten las
# iteraciones. El resultado llega siempre como pull request, nunca como push a
# main: deploy.yml deploya en cada push a main y este workflow no puede publicar
# solo.
#
# Corre contra un modelo de Cloudflare Workers AI (cuenta propia del usuario,
# sin consumir ninguna suscripción de Claude), vía el CLI de OpenCode. Requiere
# los secrets CLOUDFLARE_ACCOUNT_ID y CLOUDFLARE_API_KEY. Ver docs/ficha-harness.md.
#
# El `schedule` de más abajo es TEMPORAL: 6 corridas de prueba (2026-09-02 a
# 2026-09-07, una por día) para observar el comportamiento del arnés migrado a
# Cloudflare en corridas reales y consecutivas, re-auditando siempre la misma
# ficha (`amp`, skip_create) para poder comparar entre días. El job `gate` hace
# que las corridas por horario después del 2026-09-07 no hagan nada (se
# saltean solas, sin gastar cuota) en vez de seguir indefinidamente — pero de
# todos modos hay que sacar el bloque `schedule:` de acá una vez terminada la
# ventana, porque un `schedule:` no se auto-elimina.

on:
  workflow_dispatch:
    inputs:
      herramienta:
        description: "Herramienta a fichar (nombre, idealmente con su URL oficial)"
        required: true
      slug:
        description: "Slug a usar. Vacío = lo decide la pasada de creación"
        required: false
        default: ""
      lang:
        description: "Idioma editorial"
        required: false
        default: "es"
        type: choice
        options: ["es", "sv", "it"]
      max_loops:
        description: "Ciclos. Con 2 alcanza: auditar+corregir, y verificar. Usá 3 sólo con final_audit"
        required: false
        default: "2"
      model:
        description: "Modelo de Cloudflare Workers AI para las tres pasadas"
        required: false
        default: "cloudflare-workers-ai/@cf/moonshotai/kimi-k2.7-code"
        type: choice
        options:
          - "cloudflare-workers-ai/@cf/moonshotai/kimi-k2.7-code"
          - "cloudflare-workers-ai/@cf/zai-org/glm-5.3"
          - "cloudflare-workers-ai/@cf/openai/gpt-oss-120b"
      skip_create:
        description: "Saltear la creación y sólo auditar/corregir un slug existente"
        required: false
        default: false
        type: boolean
      final_audit:
        description: "Auditoría escéptica completa antes de aprobar (ficha de alto riesgo). Requiere max_loops=3"
        required: false
        default: false
        type: boolean
  schedule:
    # 08:52 UTC, todos los días. Elegido como "ahora + 30 min" del 2026-09-02;
    # el job `gate` es lo que acota esto a la ventana de prueba, no el cron en
    # sí (cron no tiene "corré sólo N veces").
    - cron: "52 8 * * *"

# Una corrida por vez: dos arneses en paralelo se pisarían el catálogo y las
# métricas de originalidad se medirían contra un estado a medio escribir.
concurrency:
  group: ficha-harness
  cancel-in-progress: false

jobs:
  # Sólo existe por el `schedule` temporal de arriba: un disparo manual
  # siempre pasa; uno por horario sólo pasa dentro de la ventana de prueba.
  # Sacar este job (y el `needs`/`if` de `harness`) junto con el `schedule:`
  # cuando termine la ventana.
  gate:
    runs-on: ubuntu-latest
    outputs:
      en_ventana: ${{ steps.check.outputs.en_ventana }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "en_ventana=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HOY="$(date -u +%F)"
          if [[ "$HOY" > "2026-09-07" ]]; then
            echo "en_ventana=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Ventana de prueba (2026-09-02..2026-09-07) terminada. Sacá el bloque schedule: y el job gate de ficha-harness.yml."
          else
            echo "en_ventana=true" >> "$GITHUB_OUTPUT"
          fi

  harness:
    needs: gate
    if: needs.gate.outputs.en_ventana == 'true'
    runs-on: ubuntu-latest
    # El arnés tiene límites propios por pasada (PASS_TIMEOUT); este margen
    # evita que GitHub mate el proceso antes de que el trap publique resumen y
    # artifact. Con hasta 4 pasadas de hasta 1200s cada una, 60 min no alcanza.
    timeout-minutes: 100
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install OpenCode
        run: |
          npm install -g opencode-ai
          opencode --version

      - name: Configurar git
        run: |
          git config user.name "fuenteai-harness[bot]"
          git config user.email "harness@users.noreply.github.com"
          git checkout -b "${BRANCH}"
        env:
          BRANCH: harness/ficha-${{ github.run_id }}

      # Antes de gastar una sola pasada del modelo. Las expresiones de jq que
      # arman el resumen no se ejecutan hasta el final de una corrida, así que un
      # error de sintaxis ahí se descubriría después de haber pagado las tres
      # pasadas. Tarda segundos y no consume cuota.
      - name: Test de humo del resumen
        run: bash scripts/harness/test-resumen.sh

      # Ejercita el lazo entero con un `opencode` falso: cero cuota, ~1 minuto.
      # Atrapa un defecto de flujo antes de que cueste una corrida real, que es
      # exactamente como se perdieron las dos primeras.
      - name: Test del lazo
        run: bash scripts/harness/test-lazo.sh

      - name: Correr el arnés
        id: harness
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_TOKEN_FINCHAS }}
          # Una corrida por `schedule` no tiene `inputs` (eso sólo existe en
          # workflow_dispatch): el `||` cae a los valores de la corrida de
          # prueba — re-auditar `amp`, nunca crear una ficha nueva sola.
          HERRAMIENTA: ${{ inputs.herramienta || 'Amp' }}
          # Ojo acá: `inputs.slug || 'amp'` se rompería en un disparo manual
          # normal, donde dejar `slug` vacío a propósito le dice a la pasada
          # de creación que decida ella el slug — un `||` lo pisaría siempre
          # que quedara vacío, también en manual. Por eso event_name explícito.
          SLUG: ${{ github.event_name == 'schedule' && 'amp' || inputs.slug }}
          FICHA_LANG: ${{ inputs.lang || 'es' }}
          MAX_LOOPS: ${{ inputs.max_loops || '2' }}
          MODEL: ${{ inputs.model || 'cloudflare-workers-ai/@cf/moonshotai/kimi-k2.7-code' }}
          SKIP_CREATE: ${{ github.event_name == 'schedule' && 'true' || inputs.skip_create }}
          FINAL_AUDIT: ${{ inputs.final_audit || false }}
          OUT: harness-out
          # 600s se quedaba corto con los modelos grandes de Workers AI (GLM-5.3
          # tardó más de 10 minutos en una pasada de creación real, todavía
          # investigando activamente, no trabado). 1200s da margen sin arriesgar
          # el timeout-minutes del job (que también subió, más abajo).
          PASS_TIMEOUT: 1200
        run: bash scripts/harness/run.sh

      # El resumen se publica pase lo que pase: una corrida que agota las 2
      # iteraciones es tan informativa como una que aprueba, y el informe de cada
      # vuelta es lo que dice qué ajustar en las skills.
      - name: Publicar resumen en el run
        if: always()
        run: cat harness-out/resumen.md >> "$GITHUB_STEP_SUMMARY" || echo "El arnés no llegó a generar resumen." >> "$GITHUB_STEP_SUMMARY"

      - name: Subir informes como artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harness-${{ github.run_id }}
          path: harness-out/
          retention-days: 30

      - name: Detectar cambios en el catálogo
        if: always()
        id: cambios
        run: |
          git add -A -- src/content
          if git diff --cached --quiet; then
            echo "hay=false" >> "$GITHUB_OUTPUT"
          else
            echo "hay=true" >> "$GITHUB_OUTPUT"
          fi
          # Cualquier cosa fuera de src/content que haya quedado sucia no entra al
          # PR, pero sí se reporta: es la señal de que una pasada se salió del
          # carril que le marcan los prompts.
          FUERA="$(git status --porcelain -- . ':!src/content' ':!harness-out' ':!dist')"
          if [ -n "$FUERA" ]; then
            echo "::warning::El arnés dejó cambios fuera de src/content (no se incluyen en el PR):"
            echo "$FUERA"
          fi

      - name: Crear pull request
        if: always() && steps.cambios.outputs.hay == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: harness/ficha-${{ github.run_id }}
          RESULTADO: ${{ steps.harness.outcome }}
        run: |
          SLUG="$(cat harness-out/slug.txt 2>/dev/null || echo desconocida)"
          ESTADO="$(jq -r '.resultado' harness-out/estado.json 2>/dev/null || echo desconocido)"
          VEREDICTO="$(jq -r '.veredicto' harness-out/estado.json 2>/dev/null || echo desconocido)"

          git commit -m "Ficha ${SLUG}: generada por el arnés (${ESTADO})"
          git push origin "${BRANCH}"

          {
            echo "Ficha generada automáticamente por el arnés."
            echo
            echo "- Slug: \`${SLUG}\`"
            echo "- Resultado del arnés: **${ESTADO}** (veredicto final: ${VEREDICTO})"
            echo "- [Run completo con los informes de cada iteración](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo
            cat harness-out/resumen.md 2>/dev/null || true
            echo
            echo "---"
            echo
            echo "**Antes de mergear**, revisá a ojo la ficha renderizada con \`npm run dev\`:"
            echo "el arnés no tiene navegador, así que el paso 4 de la auditoría"
            echo "(contradicciones entre plantilla y contenido en el DOM) queda pendiente."
          } > pr-body.md

          # Aprobado sale como PR normal; agotado o abortado sale como draft, para
          # que no se mergee de taquito algo que la auditoría nunca dejó pasar.
          DRAFT=""
          [ "$ESTADO" = "aprobado" ] || DRAFT="--draft"

          gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "Ficha ${SLUG} (arnés: ${ESTADO})" \
            --body-file pr-body.md \
            $DRAFT

      - name: Fallar si el arnés no aprobó
        if: always() && steps.harness.outcome != 'success'
        run: |
          echo "::error::El arnés terminó sin aprobación. Mirá el resumen del run y el artifact."
          exit 1
