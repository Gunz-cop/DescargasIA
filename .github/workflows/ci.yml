name: CI (pull requests)

# Convierte los criterios de aceptacion en una compuerta real.
#
# Hasta ahora los criterios de `docs/fases/F*.md` los corria a mano quien
# revisaba, y quien los declaraba cumplidos era la misma sesion que escribia el
# codigo. Eso funciona con un ejecutor bueno y falla en silencio con cualquier
# otro: en este proyecto ya pasaron un validador que no podia fallar, un test
# esquivado partiendo `document` en dos trozos, y un id de credencial inventado.
#
# Este workflow corre lo mismo que corre el revisor, pero lo corre GitHub: el
# examinado no puede declararse aprobado.
#
# No incluye `npm run shorten` (necesita los secretos de LinkZip y toca la red)
# ni despliega nada: eso es de deploy.yml, en push a main.

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Un PR que recibe varios push seguidos cancela la corrida anterior: solo
# importa el ultimo commit.
concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  compuerta:
    name: Criterios de aceptación
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Cada paso es un criterio que aparece por separado en el PR: si algo
      # falla, se ve cual sin abrir los logs.
      - name: Specs de fase bien formadas
        run: node .claude/skills/sdd-fases/scripts/audit-specs.mjs

      - name: Integridad del catálogo
        run: npm run catalog:audit

      - name: Integridad de los datos de hardware
        run: npm run hw:audit

      - name: Tests
        run: npm test

      - name: Tipos
        run: npx tsc --noEmit

      - name: Build
        run: npx astro build

      - name: Enlazado interno, canonical y hreflang
        run: npm run links:audit

      # El Worker solo se valida si la rama lo trae: las fases de frontend no
      # tienen por que arrastrar wrangler.
      - name: Worker (si la rama lo incluye)
        run: |
          if [ -f wrangler.jsonc ] && grep -q '"main"' wrangler.jsonc; then
            npx wrangler deploy --dry-run
          else
            echo "Esta rama no trae Worker; nada que validar."
          fi
