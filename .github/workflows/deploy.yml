name: Deploy and run SDI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sdi_mode:
        description: "Modo de SDI: run (default) o baseline (solo primera vez)"
        required: false
        default: "run"

concurrency:
  group: sdi-fuenteai-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug dispatch inputs
        run: |
          echo "event_name=[${{ github.event_name }}]"
          echo "sdi_mode=[${{ github.event.inputs.sdi_mode }}]"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      # Se invoca el archivo real en vez de "npx sdi" (que pasa por el symlink
      # de node_modules/.bin en Linux). isDirectInvocation() en sdi-cli
      # compara process.argv[1] contra import.meta.url; a través del symlink
      # esa comparación puede no matchear y el CLI queda mudo (exit 0, sin
      # imprimir ni ejecutar nada). Invocar el archivo real evita eso.
      - name: Verify SDI CLI is resolvable
        run: node ./node_modules/sdi-cli/dist/cli.js --version

      # Restaura el estado de SDI de la corrida anterior. La key incluye run_id
      # para que siempre se guarde algo nuevo al final; restore-keys busca por
      # prefijo la entrada más reciente que matchee.
      - name: Restore SDI state
        id: restore-sdi-state
        uses: actions/cache@v4
        with:
          path: .sdi
          key: sdi-state-fuenteai-${{ github.run_id }}
          restore-keys: |
            sdi-state-fuenteai-

      - name: Build site
        run: npm run build

      # El mismo dist/ que se genera acá es el que se deploya y el que SDI
      # va a leer después: no hay un segundo build en el medio.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # Solo se usa disparando el workflow manualmente con sdi_mode=baseline,
      # la primera vez, antes de habilitar sdi run.
      - name: SDI baseline (solo primera corrida manual)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.sdi_mode == 'baseline'
        run: node ./node_modules/sdi-cli/dist/cli.js baseline --confirm
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

      # Solo corre si de verdad se restauró un estado previo (cache-hit real),
      # sin importar por qué trigger llegamos acá. Esto evita notificar todas
      # las URLs de golpe si alguien re-ejecuta un run viejo sin querer.
      - name: SDI run (live)
        if: "!(github.event_name == 'workflow_dispatch' && github.event.inputs.sdi_mode == 'baseline') && steps.restore-sdi-state.outputs.cache-hit == 'true'"
        run: node ./node_modules/sdi-cli/dist/cli.js run
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

      - name: Warn if no baseline exists yet
        if: "!(github.event_name == 'workflow_dispatch' && github.event.inputs.sdi_mode == 'baseline') && steps.restore-sdi-state.outputs.cache-hit != 'true'"
        run: |
          echo "::warning::No se encontró un baseline previo (cache-hit=false). Se salteó 'sdi run' para no notificar todas las URLs de golpe. Disparar el workflow manualmente con sdi_mode=baseline."
